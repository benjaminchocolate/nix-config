# Enable Apple VideoToolbox hardware decoding
hwdec=auto

# Use the modern libplacebo GPU rendering backend
vo=gpu-next
gpu-api=auto

# High quality scaling profile
profile=gpu-hq

# Keep player open after playback finishes
keep-open=yes

# Automatic subtitle and audio language selection
slang=en,eng
alang=en,eng

icc-profile-auto=yes
